server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Doit rester superieur a spring.servlet.multipart.max-request-size, sinon
    # nginx renvoie un 413 opaque avant que l'API n'ait pu expliquer le refus.
    client_max_body_size 210m;

    # Sonde interrogee par le healthcheck du conteneur.
    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    # Les fichiers produits par Angular portent une empreinte dans leur nom :
    # ils peuvent etre caches sans risque, contrairement a index.html.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # L'API et les medias sont relayes vers le conteneur backend.
    location /api/ {
        # Resolution DNS a chaque requete plutot qu'au demarrage. Avec un nom
        # d'hote litteral, nginx refuse de demarrer tant que le conteneur d'API
        # n'existe pas : une API en panne emporterait aussi le site statique.
        # Ici, nginx demarre toujours et ne renvoie 502 que sur /api/.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api api:8080;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le streaming audio et video doit passer sans mise en tampon.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Application monopage : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
