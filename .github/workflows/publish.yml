# Construit les deux images de MusicStore, les publie sur GHCR, puis demande
# au VPS de les recuperer. Le serveur ne compile jamais : sur 4 Go, un build
# Maven et un build Angular simultanes declenchent l'OOM-killer.
name: Publier et deployer MusicStore

on:
  push:
    branches: [main, master, romuald_ted_merge]
  workflow_dispatch:

env:
  REGISTRE: ghcr.io
  PROPRIETAIRE: ndele2024

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - nom: musicstore-web
            contexte: .
            dockerfile: Dockerfile
          - nom: musicstore-api
            contexte: ./backend
            dockerfile: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRE }}/${{ env.PROPRIETAIRE }}/${{ matrix.nom }}
          # « latest » pour le deploiement courant, « sha-xxxxxxx » pour pouvoir
          # revenir a une version precise depuis le .env du VPS.
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le cache du registre evite de retelecharger les dependances Maven
          # et npm a chaque execution.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement:
    needs: images
    runs-on: ubuntu-latest
    # Le deploiement automatique n'a lieu que depuis la branche principale.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Bascule sur le VPS
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd /srv/apps && bash scripts/deploy.sh musicstore'
